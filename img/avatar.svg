<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 520" width="420" height="520" role="img">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1c3357"/>
      <stop offset="1" stop-color="#2f5d8a"/>
    </linearGradient>
    <clipPath id="frame"><rect x="0" y="0" width="420" height="520" rx="18"/></clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="420" height="520" fill="url(#bg)"/>

    <!-- сетка кода на фоне -->
    <g stroke="#ffffff" stroke-opacity=".07" stroke-width="1.4">
      <path d="M0,90 H420 M0,180 H420 M0,270 H420 M0,360 H420 M0,450 H420 M70,0 V520 M140,0 V520 M210,0 V520 M280,0 V520 M350,0 V520"/>
    </g>

    <!-- окна «редактора» -->
    <g opacity=".85">
      <rect x="24" y="34" width="150" height="86" rx="8" fill="#0f2038"/>
      <g fill="#f0b429" opacity=".9"><rect x="38" y="50" width="54" height="6" rx="3"/><rect x="38" y="64" width="88" height="6" rx="3"/></g>
      <g fill="#7fc8a9" opacity=".9"><rect x="52" y="78" width="70" height="6" rx="3"/><rect x="52" y="92" width="46" height="6" rx="3"/></g>

      <rect x="246" y="380" width="150" height="100" rx="8" fill="#0f2038"/>
      <g fill="#9fc6e8" opacity=".85"><rect x="260" y="398" width="72" height="6" rx="3"/><rect x="260" y="412" width="104" height="6" rx="3"/><rect x="260" y="426" width="58" height="6" rx="3"/></g>
      <g fill="#f0b429" opacity=".8"><rect x="274" y="440" width="86" height="6" rx="3"/><rect x="274" y="454" width="40" height="6" rx="3"/></g>
    </g>

    <!-- фигура: плечи и голова -->
    <path d="M84,520 C84,424 138,372 210,372 C282,372 336,424 336,520 Z" fill="#f0b429"/>
    <path d="M120,520 C120,448 160,406 210,406 C260,406 300,448 300,520 Z" fill="#1c3357" opacity=".18"/>
    <rect x="192" y="330" width="36" height="52" rx="14" fill="#e8b98f"/>
    <circle cx="210" cy="266" r="76" fill="#f2c79c"/>
    <!-- волосы -->
    <path d="M132,254 C132,196 168,166 210,166 C252,166 288,196 288,254 C288,232 268,214 210,214 C160,214 138,230 132,254 Z" fill="#2b2118"/>
    <!-- очки -->
    <g fill="none" stroke="#1c3357" stroke-width="6">
      <rect x="156" y="250" width="46" height="34" rx="12"/>
      <rect x="218" y="250" width="46" height="34" rx="12"/>
      <path d="M202,266 h16 M156,262 l-16,-6 M264,262 l16,-6"/>
    </g>
    <g fill="#dff0fb" opacity=".55"><rect x="160" y="254" width="38" height="12" rx="6"/><rect x="222" y="254" width="38" height="12" rx="6"/></g>
    <!-- нос и улыбка -->
    <path d="M210,286 c8,10 4,16 -4,18" fill="none" stroke="#c98f62" stroke-width="4" stroke-linecap="round"/>
    <path d="M188,318 c14,12 30,12 44,0" fill="none" stroke="#b5714a" stroke-width="5" stroke-linecap="round"/>

    <!-- воротник -->
    <path d="M186,382 L210,414 L234,382 L246,392 L210,438 L174,392 Z" fill="#fff7e6"/>

    <!-- значок &lt;/&gt; на груди -->
    <g fill="none" stroke="#1c3357" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
      <path d="M188,470 l-16,16 l16,16 M232,470 l16,16 l-16,16 M216,462 l-12,52"/>
    </g>
  </g>

  <rect x="0" y="0" width="420" height="520" rx="18" fill="none" stroke="#f0b429" stroke-width="6"/>
</svg>
